name: Generate metrics

on:
  schedule:
    - cron: '0 3 * * *'

  workflow_dispatch:

  # Restricted to this file: the commits this workflow pushes would otherwise
  # trigger it again.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/metrics.yml'

permissions:
  contents: write

jobs:
  overview:
    name: Overview
    runs-on: ubuntu-latest
    steps:
      # Pinned to a SHA: this workflow hands a token to third-party code.
      - uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d
        with:
          filename: metrics/overview.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories
          base_indepth: yes
          repositories_affiliations: owner, collaborator, organization_member
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Europe/Andorra
          config_display: large
          config_animations: yes
          config_octicon: yes
          retries: 3
          retries_delay: 120

  languages:
    name: Languages
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d
        with:
          filename: metrics/languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          base: ''
          repositories_affiliations: owner, collaborator, organization_member
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_other: yes
          plugin_languages_ignored: >-
            html, css, scss, dockerfile, makefile, cmake, batchfile, procfile,
            objective-c, roff, tex, less, gnuplot, qmake, lex
          config_timezone: Europe/Andorra
          retries: 3
          retries_delay: 120

  achievements:
    name: Achievements
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d
        with:
          filename: metrics/achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          base: ''
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_ignored: packager, sponsor, octonaut
          config_timezone: Europe/Andorra
          retries: 3
          retries_delay: 120

  community:
    name: Community
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d
        with:
          filename: metrics/community.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          base: ''
          plugin_people: yes
          plugin_people_types: followers, following
          plugin_people_limit: 28
          plugin_people_size: 28
          plugin_stars: yes
          plugin_stars_limit: 4
          config_timezone: Europe/Andorra
          retries: 3
          retries_delay: 120
